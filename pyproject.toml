[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "threebody"
version = "2.0.0"
description = "Symplectic simulations of Ekeland's symmetric three-body problem, with interactive 3D dashboards"
readme = "README.md"
license = "CC0-1.0"
authors = [{ name = "Scott Hendrickson", email = "scott@drskippy.net" }]
requires-python = ">=3.13"
dependencies = [
    "numba>=0.61",
    "numpy>=2.1",
    "plotly>=6.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "black>=25.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "scipy-stubs>=1.15",
]

[project.scripts]
threebody = "threebody.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threebody"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH"]
ignore = [
    "E501",   # black owns line length
    "N803",   # physics names such as G, M, L0
    "N806",
    "N815",
    "RUF001", # Greek letters in plot labels are intentional
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
