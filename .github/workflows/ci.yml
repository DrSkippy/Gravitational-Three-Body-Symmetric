name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.13 and the package
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"
      - name: Format (black)
        run: uv run --no-sync black --check src tests
      - name: Lint (ruff)
        run: uv run --no-sync ruff check src tests
      - name: Types (mypy --strict)
        run: uv run --no-sync mypy
      - name: Tests
        run: uv run --no-sync pytest
      - name: Integrator verification report
        run: uv run --no-sync threebody verify
